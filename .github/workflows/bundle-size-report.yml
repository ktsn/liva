name: Report bundle size

on:
  workflow_run:
    workflows: [Bundle size]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

# The head repository and branch also identify fork PRs when pull_requests is empty.
concurrency:
  group: bundle-size-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only default-branch code runs with the comment token. Never check out the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate artifact and update PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bundle-size/report.mjs
