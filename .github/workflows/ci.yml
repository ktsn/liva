name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.4.0'
          node-version-file: .node-version
          run-install: false

      - run: pnpm install --frozen-lockfile

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-

      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open('crates/liva_wasm/Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['dependencies']['wasm-bindgen'].removeprefix('=')

          print(f'version={version}')
          PY

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/liva-wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        env:
          WASM_BINDGEN_VERSION: ${{ steps.wasm-bindgen-version.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$HOME/.local/share/liva-wasm-bindgen"

      - name: Add wasm-bindgen CLI to PATH
        run: echo "$HOME/.local/share/liva-wasm-bindgen/bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Build WASM
        run: sh scripts/build-wasm.sh

      - name: Test WASM contract
        run: node scripts/test-wasm.ts

      - name: Check TypeScript, lint and formatting
        run: pnpm check

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and component tests
        run: vp test --run

      - name: Check production isolation and playback
        run: node scripts/test-production.ts

      - name: Upload WASM for browser tests
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-test-wasm
          path: packages/vite/wasm/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.4.0'
          node-version-file: .node-version
          run-install: false

      - run: pnpm install --frozen-lockfile

      - name: Download WASM
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: browser-test-wasm
          path: packages/vite/wasm/

      - name: Install browser and system dependencies
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps "$PLAYWRIGHT_BROWSER"

      - name: Run browser tests
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright test --project="$PLAYWRIGHT_BROWSER"
