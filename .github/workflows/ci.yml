name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.1.0'
          node-version-file: .node-version
          run-install: false
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: pnpm exec playwright install --with-deps
      - run: sh scripts/verify.sh
