name: Bundle size
run-name: 'Bundle size PR #${{ github.event.pull_request.number }} to ${{ github.event.pull_request.base.ref }}'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event.action != 'edited' || github.event.changes.base.ref != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.6.0'
          node-version: '26.13.1'
          run-install: false

      - name: Pin base branch tip and actual PR head
        env:
          BUNDLE_SIZE_READ_TOKEN: ${{ github.token }}
        run: node scripts/bundle-size/pin.mjs "$RUNNER_TEMP/bundle-size-pins.json"

      - name: Install browser validation tools
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Test measurement and reporting contracts
        run: node --test scripts/bundle-size/*.test.mjs

      - name: Measure pinned base and PR head
        run: node scripts/bundle-size/cli.mjs ci "$RUNNER_TEMP/bundle-size-results"

      - name: Retain result JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundle-size-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle-size-results/result.json
          if-no-files-found: warn
          retention-days: 14
